[project]
name = "archive-dmg"
version = "0.1.0"
description = "Archive macOS DMG files to Amazon S3 for eventual Glacier Deep Archive storage."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Roderic Campbell" }]
keywords = ["dmg", "s3", "glacier", "archive", "backup"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Archiving :: Backup",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "ruff>=0.6",
    "mypy>=1.11",
    "boto3-stubs[s3,sts]>=1.34",
]

[project.scripts]
archive-dmg = "archive_dmg.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archive_dmg"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "archive_dmg.*"
disallow_untyped_defs = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
